<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bijrijder</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
      html, body { height: 100%; background: #0f172a; color: #f1f5f9; }
      body { display: flex; flex-direction: column; }
      .kop { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: #1e293b; border-bottom: 1px solid #334155; gap: 8px; flex-wrap: wrap; }
      .kop-links { display: flex; align-items: center; gap: 12px; }
      .logo { height: 40px; width: 40px; border-radius: 50%; background: rgba(14,165,233,.2); display: flex; align-items: center; justify-content: center; font-size: 22px; }
      .titel { font-weight: 600; }
      .badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: rgba(16,185,129,.2); color: #6ee7b7; margin-left: 6px; }
      .status { font-size: 12px; color: #94a3b8; }
      .knoppen { display: flex; gap: 8px; }
      .pill { border: none; border-radius: 99px; padding: 8px 12px; font-size: 14px; font-weight: 500; background: #334155; color: #e2e8f0; cursor: pointer; }
      .pill.aan { background: #0ea5e9; color: #0f172a; }
      .pill.groen.aan { background: #10b981; color: #0f172a; }
      #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
      .regel { display: flex; }
      .regel.jij { justify-content: flex-end; }
      .regel.ai { justify-content: flex-start; }
      .bel { max-width: 85%; border-radius: 24px; padding: 12px 20px; font-size: 17px; line-height: 1.55; }
      .jij .bel { background: #0ea5e9; color: #0f172a; border-bottom-right-radius: 6px; }
      .ai .bel { background: #1e293b; border-bottom-left-radius: 6px; }
      .denkpunt { width: 10px; height: 10px; border-radius: 50%; background: #94a3b8; display: inline-block; animation: stuiter 1s infinite; }
      .denkpunt:nth-child(2) { animation-delay: .15s; }
      .denkpunt:nth-child(3) { animation-delay: .3s; }
      @keyframes stuiter { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      #fout { text-align: center; font-size: 13px; color: #fcd34d; padding: 0 24px; }
      #fout.goed { color: #4ade80; }
      .chips { display: flex; gap: 8px; padding: 0 16px 8px; }
      .chip { flex: 1; border: none; border-radius: 16px; background: rgba(51,65,85,.7); color: #f1f5f9; padding: 12px 6px; font-size: 14px; font-weight: 500; cursor: pointer; }
      .chip:active { transform: scale(.95); }
      .snelheid { display: flex; align-items: center; gap: 12px; padding: 0 20px 8px; font-size: 13px; color: #94a3b8; }
      .snelheid input { flex: 1; accent-color: #0ea5e9; }
      .invoer { display: flex; align-items: center; gap: 12px; padding: 8px 16px 16px; background: rgba(30,41,59,.6); border-top: 1px solid #334155; }
      #tekst { flex: 1; border-radius: 16px; border: none; background: rgba(51,65,85,.7); color: #f1f5f9; padding: 14px 16px; font-size: 17px; outline: none; }
      #tekst:focus { box-shadow: 0 0 0 2px #0ea5e9; }
      #stuur { height: 56px; width: 56px; border-radius: 16px; border: none; background: #0ea5e9; color: #0f172a; font-size: 22px; cursor: pointer; }
      #stuur:disabled { opacity: .4; }
      #mic { height: 64px; width: 64px; border-radius: 50%; border: none; background: #10b981; color: #0f172a; font-size: 26px; cursor: pointer; }
      #mic.luistert { background: #ef4444; animation: puls 1.2s infinite; }
      @keyframes puls { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
      .uitleg { font-size: 12px; color: #94a3b8; text-align: center; padding: 0 24px 8px; }
    </style>
  </head>
  <body>
    <div class="kop">
      <div class="kop-links">
        <div class="logo">🚗</div>
        <div>
          <div class="titel">Bijrijder<span class="badge">echte AI</span></div>
          <div class="status" id="status">kletsmodus</div>
        </div>
      </div>
      <div class="knoppen">
        <button class="pill" id="knopPraat" onclick="wisselPraat()">🔊 uit</button>
        <button class="pill groen" id="knopHandsfree" onclick="wisselHandsfree()">🚙 Handsfree uit</button>
        <button class="pill" onclick="nieuwGesprek()" aria-label="Nieuw gesprek">♻️</button>
      </div>
    </div>

    <div id="chat"></div>
    <div id="fout"></div>

    <div class="chips">
      <button class="chip" onclick="stuur('Vertel eens een goede grap')">😄 Grap</button>
      <button class="chip" onclick="stuur('Vertel eens een verbazingwekkend feit')">🧠 Feit</button>
      <button class="chip" onclick="stuur('Wat is er interessant in het nieuws deze week?')">📰 Nieuws</button>
      <button class="chip" onclick="stuur('Ik verveel me, geef me een leuke opdracht')">🎯 Spel</button>
    </div>

    <div class="snelheid" id="snelheidsbalk" style="display:none">
      <span>Spraaksnelheid</span>
      <input type="range" min="0" max="1" step="0.1" value="0.6" id="staal" oninput="staalWaarde=this.value" />
    </div>

    <div id="stemrij" style="display:none; padding: 0 16px 8px;">
      <button class="chip" onclick="openStemKiezer()">🗣 Stem kiezen</button>
    </div>

    <div id="stemKiezer" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.6); z-index:50;" onclick="sluitStemKiezer()">
      <div style="position:absolute; bottom:0; left:0; right:0; background:#1e293b; border-radius:24px 24px 0 0; padding:16px; max-height:70%; overflow-y:auto;" onclick="event.stopPropagation()">
        <div style="font-weight:600; margin-bottom:12px;">Stem kiezen</div>
        <div id="stemLijst"></div>
        <button class="chip" style="width:100%; margin-top:12px;" onclick="sluitStemKiezer()">Sluiten</button>
      </div>
    </div>

    <div class="invoer">
      <input id="tekst" placeholder="Typ iets…" onkeydown="if(event.key==='Enter')stuurVanInvoer()" />
      <button id="stuur" onclick="stuurVanInvoer()" aria-label="Verstuur">➤</button>
      <button id="mic" onclick="wisselMic()" aria-label="Praat">🎙</button>
    </div>
    <div class="uitleg" id="uitleg">Tip: zet Handsfree aan — na elk antwoord luister ik automatisch weer.</div>

    <script>
      var SLEUTEL = "sk_fYVtJBx3EhQA0LsqFXtfgCX0ZHEuJA2Y";
      var EINDPUNT = "https://gen.pollinations.ai/v1/chat/completions";
      var SYSTEEM = {
        role: "system",
        content:
          "Je bent 'Bijrijder', een scherpe, gezellige Nederlandse gesprekspartner voor iemand die in de auto rijdt. " +
          "Antwoord ALTIJD in het Nederlands, kort en mondeling (max 3 zinnen), warm en humoristisch. " +
          "Geen opsommingen of markdown — gewoon praatbare taal. " +
          "Als je zoekresultaten krijgt aangeboden, behandel die als actuele en betrouwbare informatie: antwoord er DIRECT en concreet mee. Gok niet, wees niet voorzichtig en vraag NIET om duiding als het antwoord erin staat. " +
          "Vraag alleen iets terug als er werkelijk geen informatie beschikbaar is. " +
          "NOOIT opmerkingen over verkeer, rijden, oplettendheid of veiligheid — dat is de taak van de navigatie, niet van jou."
      };

      var GRAPPEN = [
        "Ik wilde een grap over de file maken, maar die was te lang.",
        "Wat zei de ene band tegen de andere? Ik voel me onder druk gezet.",
        "Waarom nam de auto een pauze? Hij zat op zijn reserves."
      ];
      var FEITEN = [
        "Wist je dat een gemiddelde auto ongeveer 30.000 onderdelen bevat?",
        "De eerste verkeerslichten stonden in 1868 in Londen — en draaiden op gas.",
        "Bertha Benz reed in 1888 de eerste lange autorit ooit: ruim 100 kilometer, zonder navigatie."
      ];

      var chat = document.getElementById("chat");
      var statusEl = document.getElementById("status");
      var foutEl = document.getElementById("fout");
      var tekstEl = document.getElementById("tekst");
      var stuurKnop = document.getElementById("stuur");
      var micKnop = document.getElementById("mic");
      var knopPraat = document.getElementById("knopPraat");
      var knopHandsfree = document.getElementById("knopHandsfree");
      var snelheidsbalk = document.getElementById("snelheidsbalk");

      var staalWaarde = 0.6;
      var praatAan = false;
      var handsfreeAan = false;
      var bezig = false;
      var luistert = false;
      var geschiedenis = [];

      function laad(sleutel, anders) {
        try {
          var r = window.localStorage.getItem(sleutel);
          if (r) return JSON.parse(r);
        } catch (e) {}
        return anders;
      }
      function bewaar(sleutel, waarde) {
        try {
          window.localStorage.setItem(sleutel, JSON.stringify(waarde));
        } catch (e) {}
      }

      geschiedenis = laad("bijrijder-historie", []);
      var gekozenStemNaam = laad("bijrijder-stem", null);

      function vindStem(stemmen) {
        if (!gekozenStemNaam) return null;
        for (var i = 0; i < stemmen.length; i++) {
          if (stemmen[i].name === gekozenStemNaam) return stemmen[i];
        }
        return null;
      }

      function openStemKiezer() {
        var lijst = document.getElementById("stemLijst");
        lijst.innerHTML = "";
        var stemmen = typeof window.speechSynthesis !== "undefined" ? window.speechSynthesis.getVoices() || [] : [];
        var nlStemmen = [];
        for (var i = 0; i < stemmen.length; i++) {
          if (stemmen[i].lang && stemmen[i].lang.indexOf("nl") === 0) nlStemmen.push(stemmen[i]);
        }

        var autoKnop = document.createElement("button");
        autoKnop.className = "chip";
        autoKnop.style.width = "100%";
        autoKnop.style.marginBottom = "8px";
        autoKnop.textContent = "Automatisch (beste stem)";
        autoKnop.onclick = function () { kiesStem(null); };
        lijst.appendChild(autoKnop);

        if (!nlStemmen.length) {
          var leeg = document.createElement("div");
          leeg.className = "uitleg";
          leeg.style.padding = "8px";
          leeg.textContent = "Nog geen Nederlandse stemmen gevonden. Sluit dit scherm en open het opnieuw.";
          lijst.appendChild(leeg);
        }

        for (var j = 0; j < nlStemmen.length; j++) {
          var knop = document.createElement("button");
          knop.className = "chip";
          knop.style.width = "100%";
          knop.style.marginBottom = "8px";
          knop.textContent = nlStemmen[j].name + (gekozenStemNaam === nlStemmen[j].name ? " ✓" : "");
          (function (stem) {
            knop.onclick = function () { kiesStem(stem.name); };
          })(nlStemmen[j]);
          lijst.appendChild(knop);
        }

        document.getElementById("stemKiezer").style.display = "block";
      }

      function kiesStem(naam) {
        gekozenStemNaam = naam;
        bewaar("bijrijder-stem", naam);
        sluitStemKiezer();
        spreekUit("Hallo! Dit is hoe ik nu klink.", null);
      }

      function sluitStemKiezer() {
        document.getElementById("stemKiezer").style.display = "none";
      }

      var berichten = laad("bijrijder-chat", [{ van: "bijrijder", tekst: "Hoi! Ik ben je bijrijder. Zet Handsfree aan en we kletsen gewoon door — of tik de microfoon en praat." }]);

      function toonBerichten() {
        chat.innerHTML = "";
        for (var i = 0; i < berichten.length; i++) {
          var b = berichten[i];
          var regel = document.createElement("div");
          regel.className = "regel " + (b.van === "jij" ? "jij" : "ai");
          var bel = document.createElement("div");
          bel.className = "bel";
          bel.textContent = b.tekst;
          regel.appendChild(bel);
          chat.appendChild(regel);
        }
        chat.scrollTop = chat.scrollHeight;
        bewaar("bijrijder-chat", berichten);
      }

      function zetStatus() {
        var t = luistert ? "luistert…" : bezig ? "denkt na…" : handsfreeAan ? "handsfree — praat maar los" : praatAan ? "voorleesmodus" : "kletsmodus";
        statusEl.textContent = t;
        micKnop.className = luistert ? "luistert" : "";
        micKnop.textContent = luistert ? "■" : "🎙";
        knopPraat.textContent = "🔊 " + (praatAan ? "aan" : "uit");
        knopPraat.className = "pill" + (praatAan ? " aan" : "");
        knopHandsfree.textContent = "🚙 Handsfree " + (handsfreeAan ? "aan" : "uit");
        knopHandsfree.className = "pill groen" + (handsfreeAan ? " aan" : "");
        snelheidsbalk.style.display = praatAan || handsfreeAan ? "flex" : "none";
        document.getElementById("stemrij").style.display = praatAan || handsfreeAan ? "block" : "none";
        document.getElementById("uitleg").style.display = handsfreeAan ? "none" : "block";
      }

      function offlineAntwoord(t) {
        var x = t.toLowerCase();
        if (/(grap|lol|lachen|mop)/.test(x)) return GRAPPEN[Math.floor(Math.random() * GRAPPEN.length)];
        if (/(feit|weet je|wist je|interessant)/.test(x)) return FEITEN[Math.floor(Math.random() * FEITEN.length)];
        return "Even geen verbinding met de slimme backend — maar ik ben er nog. Probeer het over een paar seconden opnieuw.";
      }

      var NIEUWSBRONNEN = [
        "https://feeds.nos.nl/nosnieuwsalgemeen",
        "https://www.nu.nl/rss/Algemeen"
      ];

      function haalKoppen() {
        var verzoeken = NIEUWSBRONNEN.map(function (bron) {
          return fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(bron))
            .then(function (r) { return r.json(); })
            .catch(function () { return null; });
        });
        return Promise.all(verzoeken).then(function (resultaten) {
          var koppen = [];
          for (var i = 0; i < resultaten.length; i++) {
            var data = resultaten[i];
            if (data && data.items) {
              for (var j = 0; j < Math.min(5, data.items.length); j++) {
                if (data.items[j] && data.items[j].title) {
                  koppen.push("- " + data.items[j].title);
                }
              }
            }
          }
          return koppen;
        });
      }

      function haalWiki(onderwerp) {
        var zoekUrl =
          "https://nl.wikipedia.org/w/api.php?action=query&list=search&srsearch=" +
          encodeURIComponent(onderwerp) + "&srlimit=2&format=json&origin=*";
        return fetch(zoekUrl)
          .then(function (r) { return r.json(); })
          .then(function (data) {
            var hits = data && data.query && data.query.search ? data.query.search : [];
            if (!hits.length) return [];
            var titels = [];
            for (var i = 0; i < hits.length; i++) titels.push(hits[i].title);
            var somUrl =
              "https://nl.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1&format=json&origin=*&titles=" +
              encodeURIComponent(titels.join("|"));
            return fetch(somUrl)
              .then(function (r) { return r.json(); })
              .catch(function () { return null; })
              .then(function (som) {
                var paginas = som && som.query && som.query.pages ? som.query.pages : {};
                var teksten = [];
                for (var key in paginas) {
                  if (paginas[key] && paginas[key].extract) {
                    teksten.push(paginas[key].title + ": " + paginas[key].extract.slice(0, 700));
                  }
                }
                return teksten;
              });
          })
          .catch(function () { return []; });
      }

      function haalOpeningsTijden(vraag) {
        var m =
          vraag.match(/openingstijden van\s+(?:de |het |een )?(.+?)[?.]*$/i) ||
          vraag.match(/hoe laat (?:gaat|is|opent)\s+(?:de |het |een )?(.+?)(?:\s+open|\s+dicht)?[?.]*$/i) ||
          vraag.match(/wanneer opent\s+(?:de |het |een )?(.+?)[?.]*$/i) ||
          vraag.match(/is\s+(?:de |het |een )?(.+?)\s+(?:open|gesloten|dicht)/i);
        var naam = m ? m[1] : "";
        if (!naam) {
          naam = vraag
            .replace(/(wat zijn|wat is|hoe laat|wanneer|openingstijden|open|gesloten|dicht|van |de |het |een |gaat|is|opent|\?)/gi, " ")
            .replace(/\s+/g, " ")
            .trim();
        }
        if (!naam || naam.length < 2) return Promise.resolve(null);
        var zoekUrl = "https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=nl&q=" + encodeURIComponent(naam);
        return fetch(zoekUrl)
          .then(function (r) { return r.json(); })
          .catch(function () { return null; })
          .then(function (plekken) {
            if (!plekken || !plekken.length) return null;
            var p = plekken[0];
            var type = p.osm_type === "relation" ? "rel" : p.osm_type === "way" ? "way" : p.osm_type === "node" ? "node" : null;
            if (!type) return null;
            var data = encodeURIComponent("[out:json];" + type + "(" + p.osm_id + ");out tags;");
            return fetch("https://overpass-api.de/api/interpreter?data=" + data)
              .then(function (r) { return r.json(); })
              .catch(function () { return null; })
              .then(function (ov) {
                if (ov && ov.elements && ov.elements.length && ov.elements[0].tags) {
                  var tags = ov.elements[0].tags;
                  var plek = tags.name || naam;
                  if (tags.opening_hours) {
                    return plek + ": openingstijden volgens OpenStreetMap — " + tags.opening_hours + (tags.website ? " (website: " + tags.website + ")" : "");
                  }
                  return plek + ": gevonden op de kaart, maar zonder geregistreerde openingstijden.";
                }
                return null;
              });
          })
          .catch(function () { return null; });
      }

      var OSM_CATEGORIEEN = [
        { woorden: /supermarkt|jumbo|albert heijn|\bah\b|lidl|aldi|vomar|coop/, label: "Supermarkten", tags: ["shop=supermarket"] },
        { woorden: /bakker|broodzaak/, label: "Bakkerijen", tags: ["shop=bakery"] },
        { woorden: /drogist|kruidvat|etos/, label: "Drogisterijen", tags: ["shop=chemist"] },
        { woorden: /apotheek/, label: "Apotheken", tags: ["amenity=pharmacy"] },
        { woorden: /tankstation|tanken|benzine|brandstof/, label: "Tankstations", tags: ["amenity=fuel"] },
        { woorden: /restaurant|pizzeria|grillroom|eetcaf/, label: "Restaurants", tags: ["amenity=restaurant"] },
        { woorden: /kapsalon|kapper/, label: "Kapsalons", tags: ["shop=hairdresser"] },
        { woorden: /garage|apk|auto.*reparat/, label: "Garages", tags: ["shop=car_repair"] },
        { woorden: /geldautomaat|pinnen|bank$/, label: "Banken en geldautomaten", tags: ["amenity=bank", "amenity=atm"] },
        { woorden: /postkantoor|postnl|dhl|pakketpunt/, label: "Postpunten", tags: ["amenity=post_office"] }
      ];

      function haalPlaatsInfo(vraag) {
        var cat = null;
        for (var i = 0; i < OSM_CATEGORIEEN.length; i++) {
          if (OSM_CATEGORIEEN[i].woorden.test(vraag)) { cat = OSM_CATEGORIEEN[i]; break; }
        }
        if (!cat) return Promise.resolve(null);
        var pm = vraag.match(/(?:in|bij|te|rond)\s+([A-Z][A-Za-z\-' ]{2,})/) || vraag.match(/(?:in|bij|te)\s+([a-z][a-z\-' ]{2,})/i);
        var plaats = pm ? pm[1].replace(/\s+(zitten|zit|er|is|zijn|nog|ook|open).*$/i, "").trim() : "";
        if (!plaats) return Promise.resolve(null);
        var geoUrl = "https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=nl&q=" + encodeURIComponent(plaats);
        return fetch(geoUrl)
          .then(function (r) { return r.json(); })
          .catch(function () { return null; })
          .then(function (plekken) {
            if (!plekken || !plekken.length) return null;
            var p = plekken[0];
            var filters = "";
            for (var f = 0; f < cat.tags.length; f++) {
              var delen = cat.tags[f].split("=");
              filters += 'node["' + delen[0] + '"="' + delen[1] + '"](around:4000,' + p.lat + "," + p.lon + ');';
            }
            var q = encodeURIComponent("[out:json][timeout:25];(" + filters + ");out tags center;");
            return fetch("https://overpass-api.de/api/interpreter?data=" + q)
              .then(function (r) { return r.json(); })
              .catch(function () { return null; })
              .then(function (ov) {
                if (!ov || !ov.elements || !ov.elements.length) return null;
                var namen = [];
                for (var k = 0; k < Math.min(8, ov.elements.length); k++) {
                  var t = ov.elements[k].tags || {};
                  if (!t.name) continue;
                  var regel = t.name;
                  if (t["addr:street"]) regel += ", " + t["addr:street"] + (t["addr:housenumber"] ? " " + t["addr:housenumber"] : "");
                  if (t.opening_hours) regel += " — open: " + t.opening_hours;
                  if (namen.indexOf(regel) === -1) namen.push(regel);
                }
                if (!namen.length) return null;
                return cat.label + " binnen 4 km van " + plaats + ":\n- " + namen.join("\n- ");
              });
          })
          .catch(function () { return null; });
      }

      var MISTRAL_SLEUTEL = "mstrl_wGSEPdvYWhHiotmdpCuQ2lVXhrXK4mkB_24fW1R";
      var MISTRAL_EINDPUNT = "https://api.mistral.ai/v1/chat/completions";

      function bouwBerichten() {
        var msgs = [SYSTEEM]
          .concat(liveContext ? [{ role: "system", content: "Opgezochte actuele informatie:\n" + liveContext + "\nGebruik deze inhoudelijk in je antwoord." }] : [])
          .concat(geschiedenis.slice(-12));
        if (liveContext) {
          for (var i = msgs.length - 1; i >= 0; i--) {
            if (msgs[i].role === "user") {
              msgs[i] = {
                role: "user",
                content: msgs[i].content +
                  "\n\n[Je zojuist opgezochte resultaten: " + liveContext + "]\n" +
                  "Antwoord direct en concreet op basis van deze resultaten — niet gokken, niet om duiding vragen."
              };
              break;
            }
          }
        }
        return msgs;
      }

      function pogingMistral() {
        return fetch(MISTRAL_EINDPUNT, {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + MISTRAL_SLEUTEL },
          body: JSON.stringify({ model: "mistral-small-latest", messages: bouwBerichten(), temperature: 0.7 })
        }).then(function (res) {
          if (!res.ok) throw new Error("Mistral " + res.status);
          return res.json();
        }).then(function (data) {
          var tekst = data && data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : null;
          if (typeof tekst !== "string" || !tekst.trim()) throw new Error("Leeg antwoord");
          return tekst.trim();
        });
      }

      function poging() {
        return fetch(EINDPUNT, {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + SLEUTEL },
          body: JSON.stringify({ model: "openai", messages: bouwBerichten(), temperature: 0.8 })
        }).then(function (res) {
          if (!res.ok) throw new Error("API " + res.status);
          return res.json();
        }).then(function (data) {
          var tekst = data && data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : null;
          if (typeof tekst !== "string" || !tekst.trim()) throw new Error("Leeg antwoord");
          return tekst.trim();
        });
      }

      function bouwPrompt() {
        var regels = [];
        var begin = Math.max(0, geschiedenis.length - 6);
        for (var i = begin; i < geschiedenis.length; i++) {
          regels.push((geschiedenis[i].role === "user" ? "Gebruiker: " : "Bijrijder: ") + geschiedenis[i].content);
        }
        return (liveContext ? "Opgezochte actuele informatie (gebruik dit direct en concreet):\n" + liveContext + "\n\n" : "") + (regels.length ? "Dit is ons gesprek tot nu toe:\n" + regels.join("\n") + "\n\n" : "") + "Geef één passend, kort antwoord als de bijrijder, gebaseerd op de opgezochte informatie.";
      }

      function pogingGET() {
        var url = "https://gen.pollinations.ai/text/" + encodeURIComponent(bouwPrompt()) + "?model=openai&key=" + SLEUTEL;
        return fetch(url).then(function (res) {
          if (!res.ok) throw new Error("API " + res.status);
          return res.text();
        }).then(function (tekst) {
          if (typeof tekst !== "string" || !tekst.trim()) throw new Error("Leeg antwoord");
          return tekst.trim();
        });
      }

      function wacht(ms) {
        return new Promise(function (op) { setTimeout(op, ms); });
      }

      function pogingLEGACY() {
        var url = "https://text.pollinations.ai/" + encodeURIComponent(bouwPrompt()) + "?model=openai&key=" + SLEUTEL + "&system=" + encodeURIComponent(SYSTEEM.content);
        return fetch(url).then(function (res) {
          if (!res.ok) throw new Error("API " + res.status);
          return res.text();
        }).then(function (tekst) {
          if (typeof tekst !== "string" || !tekst.trim()) throw new Error("Leeg antwoord");
          return tekst.trim();
        });
      }

      function pogingAlles() {
        return pogingMistral().catch(poging).catch(pogingGET).catch(pogingLEGACY);
      }

      function vraagAI() {
        return pogingAlles().catch(function () {
          return wacht(5000).then(pogingAlles);
        });
      }

      var stemGeactiveerd = false;
      function activeerStem() {
        if (stemGeactiveerd || typeof window.speechSynthesis === "undefined") return;
        try {
          var warm = new SpeechSynthesisUtterance(" ");
          warm.volume = 0;
          window.speechSynthesis.speak(warm);
          stemGeactiveerd = true;
        } catch (e) {}
      }

      function spreekUit(tekst, klaar) {
        if ((!praatAan && !handsfreeAan) || typeof window.speechSynthesis === "undefined") {
          if (klaar) klaar();
          return;
        }
        var u = new SpeechSynthesisUtterance(tekst);
        u.lang = "nl-NL";
        u.rate = 0.5 + staalWaarde * 0.5;
        u.volume = 1;
        try {
          var stemmen = window.speechSynthesis.getVoices() || [];
          var gekozen = vindStem(stemmen);
          if (gekozen) {
            u.voice = gekozen;
          } else {
            var beste = null;
            var besteScore = 0;
            for (var i = 0; i < stemmen.length; i++) {
              var s = stemmen[i];
              if (!s.lang || s.lang.indexOf("nl") !== 0) continue;
              var info = (s.name + " " + (s.voiceURI || "")).toLowerCase();
              var score = 1;
              if (info.indexOf("premium") !== -1 || info.indexOf("enhanced") !== -1 || info.indexOf("verbeterd") !== -1) {
                score = 3;
              } else if (info.indexOf("xander") !== -1 || info.indexOf("ellen") !== -1) {
                score = 2;
              }
              if (score > besteScore) {
                besteScore = score;
                beste = s;
              }
            }
            if (beste) u.voice = beste;
          }
        } catch (e) {}
        if (klaar) {
          u.onend = klaar;
          u.onerror = klaar;
        }
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
      }

      function stuur(rauw) {
        var inhoud = (rauw || "").trim();
        if (!inhoud || bezig) return;
        bezig = true;
        activeerStem();
        foutEl.classList.remove("goed");
        foutEl.textContent = "";
        tekstEl.value = "";
        berichten.push({ van: "jij", tekst: inhoud });
        geschiedenis.push({ role: "user", content: inhoud });
        bewaar("bijrijder-historie", geschiedenis);
        toonBerichten();
        zetStatus();
        var denkBubbel = document.createElement("div");
        denkBubbel.className = "regel ai";
        denkBubbel.innerHTML = '<div class="bel"><span class="denkpunt"></span> <span class="denkpunt"></span> <span class="denkpunt"></span></div>';
        chat.appendChild(denkBubbel);
        chat.scrollTop = chat.scrollHeight;
        var nieuwsVraag = /(nieuws|actualiteit|gebeurd|headlines|krant)/i.test(inhoud);
        var wikiVraag = /(wie |wat is |wat was |wat zijn |wanneer |waar |welke |hoeveel |hoelang |vertel iets over|vertel over|weet je iets over|ken je )/i.test(inhoud);
        var otVraag = /(openingstijden|hoe laat|wanneer open|gesloten)/i.test(inhoud);
        var plaatsVraag = /(welke |waar kan ik|waar vind ik|zit er|zitten er|in de buurt)/i.test(inhoud);

        Promise.all([
          nieuwsVraag ? haalKoppen().catch(function () { return []; }) : Promise.resolve([]),
          wikiVraag ? haalWiki(inhoud).catch(function () { return []; }) : Promise.resolve([]),
          otVraag ? haalOpeningsTijden(inhoud).catch(function () { return null; }) : Promise.resolve(null),
          plaatsVraag ? haalPlaatsInfo(inhoud).catch(function () { return null; }) : Promise.resolve(null)
        ])
          .then(function (vondsten) {
            var stukken = [];
            if (vondsten[0] && vondsten[0].length) stukken.push("Actuele nieuwskoppen van vandaag:\n" + vondsten[0].join("\n"));
            if (vondsten[1] && vondsten[1].length) stukken.push("Achtergrondinformatie (Wikipedia):\n" + vondsten[1].join("\n"));
            if (vondsten[2]) stukken.push("Openingstijden en kaartgegevens:\n" + vondsten[2]);
            if (vondsten[3]) stukken.push("Gevonden plaatsen in de buurt (OpenStreetMap):\n" + vondsten[3]);
            if (stukken.length) {
              liveContext = stukken.join("\n\n");
              foutEl.classList.add("goed");
              foutEl.textContent = "✓ Actuele informatie opgehaald (" + stukken.length + (stukken.length === 1 ? " bron)" : " bronnen)");
            } else if (nieuwsVraag || wikiVraag || otVraag) {
              foutEl.textContent = "Kon geen actuele informatie ophalen — ik antwoord uit algemene kennis.";
            }
            return vraagAI();
          })
          .catch(function (e) {
            foutEl.textContent =
              String(e && e.message ? e.message : "").indexOf("429") !== -1
                ? "De gratis AI-dienst is even op slot (max. 1 antwoord per 15 sec) — dit was een offline-antwoord."
                : "Geen verbinding met de AI — dit was een offline-antwoord. Probeer het zo weer.";
            return offlineAntwoord(inhoud);
          })
          .then(function (antwoord) {
            bezig = false;
            denkBubbel.remove();
            berichten.push({ van: "bijrijder", tekst: antwoord });
            geschiedenis.push({ role: "assistant", content: antwoord });
            bewaar("bijrijder-historie", geschiedenis);
            toonBerichten();
            zetStatus();
            spreekUit(antwoord, function () {
              if (handsfreeAan) startLuisteren();
            });
          });
      }

      function stuurVanInvoer() {
        stuur(tekstEl.value);
      }

      // ---------- Spraakherkenning ----------
      var herkenner = null;
      var liveContext = null;
      function gebruikHerkenner() {
        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) return null;
        var r = new SR();
        r.lang = "nl-NL";
        r.continuous = false;
        r.interimResults = false;
        return r;
      }

      function startLuisteren() {
        if (luistert || bezig) return;
        activeerStem();
        var r = gebruikHerkenner();
        if (!r) {
            foutEl.textContent = "Spraakherkenning wordt niet ondersteund door deze browser — typ gerust, ik lees alles voor.";
            return;
        }
        herkenner = r;
        r.onresult = function (e) {
          luistert = false;
          zetStatus();
          stuur(e.results[0][0].transcript);
        };
        r.onend = function () {
          luistert = false;
          zetStatus();
        };
        r.onerror = function () {
          luistert = false;
          zetStatus();
          foutEl.textContent = "Ik kon je even niet verstaan. Probeer het opnieuw.";
        };
        luistert = true;
        zetStatus();
        r.start();
      }

      function stopLuisteren() {
        if (herkenner) herkenner.stop();
        luistert = false;
        zetStatus();
      }

      function wisselMic() {
        if (luistert) stopLuisteren();
        else startLuisteren();
      }

      function wisselPraat() {
        praatAan = !praatAan;
        if (!praatAan) handsfreeAan = false;
        if (!praatAan && typeof window.speechSynthesis !== "undefined") window.speechSynthesis.cancel();
        zetStatus();
      }

      function wisselHandsfree() {
        handsfreeAan = !handsfreeAan;
        if (handsfreeAan) {
          praatAan = true;
          startLuisteren();
        } else {
          stopLuisteren();
        }
        zetStatus();
      }

      function nieuwGesprek() {
        if (typeof window.speechSynthesis !== "undefined") window.speechSynthesis.cancel();
        stopLuisteren();
        handsfreeAan = false;
        geschiedenis = [];
        berichten = [{ van: "bijrijder", tekst: "Nieuwe start! Waar wil je het met me over hebben?" }];
        bewaar("bijrijder-chat", berichten);
        bewaar("bijrijder-historie", geschiedenis);
        foutEl.textContent = "";
        toonBerichten();
        zetStatus();
      }

      toonBerichten();
      zetStatus();
    </script>
  </body>
</html>
